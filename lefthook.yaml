pre-commit:
  parallel: true
  jobs:
    - name: test integrity
      files: git diff --cached --name-only --diff-filter=ACMRD -- '*_test.go'
      run: scripts/check-test-integrity.sh --cached {files}

    - name: targeted tests
      run: REPO_TEMP_ENV_ISOLATE=1 scripts/go-test-targeted.sh {staged_files}

    - name: architecture
      glob: "**/*.go"
      run: go tool go-file-arch -config .architecture.yaml ./...

pre-push:
  parallel: true
  jobs:
    - name: full build
      run: scripts/go-build-all.sh

    - name: full tests
      run: scripts/go-test-all.sh

    - name: ffmpeg tests
      run: scripts/go-test-ffmpeg.sh

    - name: staticcheck and deadcode
      files: git diff origin/main --name-only --diff-filter=ACMR -- '*.go'
      run: scripts/check-deadcode.sh {files}

ci:
  parallel: true
  jobs:
    - name: test integrity
      files: git diff origin/main --name-only --diff-filter=ACMRD -- '*_test.go'
      run: scripts/check-test-integrity.sh origin/main {files}

    - name: architecture
      run: go tool go-file-arch -config .architecture.yaml ./...

    - name: targeted tests
      files: git diff origin/main --name-only --diff-filter=ACMR -- '*.go'
      run: REPO_TEMP_ENV_ISOLATE=1 scripts/go-test-targeted.sh {files}

    - name: staticcheck and deadcode
      files: git diff origin/main --name-only --diff-filter=ACMR -- '*.go'
      run: REPO_TEMP_ENV_ISOLATE=1 scripts/check-deadcode.sh {files}

    - name: full build
      run: REPO_TEMP_ENV_ISOLATE=1 scripts/go-build-all.sh

    - name: full tests
      run: REPO_TEMP_ENV_ISOLATE=1 scripts/go-test-all.sh

    - name: ffmpeg tests
      run: REPO_TEMP_ENV_ISOLATE=1 scripts/go-test-ffmpeg.sh
